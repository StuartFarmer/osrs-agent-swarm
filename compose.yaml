services:
  swarm:
    build: .
    init: true
    mem_limit: 32g
    shm_size: 16gb
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - swarm-state:/app/.local
      - ./.local/hiscores:/app/.local/hiscores
      - ./runs:/app/runs
      - ./agents:/app/agents:ro
      - ./experiments:/app/experiments:ro
    stop_grace_period: 240s
volumes:
  swarm-state:
